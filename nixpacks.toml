# Como o Railway constrói e roda o One OS.
#
# Este arquivo é a ÚNICA fonte dos comandos de build. O railway.json cuida
# só do deploy (start, healthcheck): ter os dois definindo build faz o
# Railway rodar um comando que ignora as fases daqui.

[phases.setup]
# Next 16 exige Node >=20.9 e Prisma 7 exige >=20.19. Sem esta linha o
# Railway usa a versão padrão dele e a instalação falha.
nixPkgs = ["nodejs_22"]

[phases.install]
# `npm ci` apaga node_modules inteiro antes de instalar, e isso colide com
# o cache que o Railway monta na mesma pasta: dá "EBUSY: resource busy or
# locked, rmdir '/app/node_modules/.cache'".
#
# `npm install` respeita o package-lock.json do mesmo jeito, mas atualiza a
# pasta no lugar em vez de removê-la.
cmds = ["npm install --include=dev --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
