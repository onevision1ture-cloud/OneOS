<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — Onevision OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%236E1220'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-style='italic' font-size='58' fill='%23FAF6EF' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .crm-wrap{overflow-x:hidden;}
  .crm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;}
  .crm-col{background:var(--cream-deep);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:120px;}
  .crm-col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 2px;}
  .crm-col-head b{font-family:'Space Grotesk',sans-serif;font-size:13px;}
  .crm-col-head span{font-size:11px;color:var(--ink-3);}
  .lead-card{
    background:var(--panel-bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:grab;
    box-shadow:var(--shadow-sm);transition:box-shadow .2s;
  }
  .lead-card:hover{box-shadow:var(--shadow-sm);}
  .lead-card b{font-family:'Space Grotesk',sans-serif;font-size:13px;display:block;margin-bottom:4px;}
  .lead-card .l-value{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;color:var(--wine);}
  .lead-card .l-contact{font-size:11.5px;color:var(--ink-2);margin-top:3px;}
  .lead-card .l-follow{font-size:10.5px;margin-top:6px;display:inline-flex;padding:3px 8px;border-radius:999px;font-family:'Space Grotesk',sans-serif;font-weight:600;}
</style>
</head>
<body>

<div id="page-content">
  <div class="page-head">
    <div>
      <h1>CRM & <em>follow-up</em></h1>
      <p>Todo o funil numa página só — sem scroll horizontal, pra não perder ninguém de vista.</p>
    </div>
    <div class="page-head-actions">
      <button class="btn btn-primary" id="newLeadBtn">+ Novo lead</button>
    </div>
  </div>

  <div class="kpi-grid" id="crmKpis"></div>

  <div class="crm-wrap">
    <div class="crm-grid" id="crmGrid"></div>
  </div>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/dragdrop.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/pages/crm.js"></script>
</body>
</html>
