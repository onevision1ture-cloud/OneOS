<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatórios — Onevision OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%236E1220'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-style='italic' font-size='58' fill='%23FAF6EF' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital,wght@0,400;1,400&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .report-controls{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:22px;}
  .report-controls .field{min-width:220px;}
  .report-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .report-header h2{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:26px;}
  .report-header p{color:var(--ink-3);font-size:12.5px;margin-top:4px;}
  .report-section{margin-bottom:26px;}
  .report-section h4{font-family:'Space Grotesk',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:12px;}
  .report-campaign-row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;}
  .report-campaign-row:first-child{border-top:none;}
  @media print{
    body *{visibility:hidden;}
    .report-print-area, .report-print-area *{visibility:visible;}
    .report-print-area{position:absolute;top:0;left:0;width:100%;padding:20px;}
  }
</style>
</head>
<body>

<div id="page-content">
  <div class="page-head">
    <div>
      <h1>Central de <em>relatórios</em></h1>
      <p>Gere relatórios semanais ou mensais para qualquer cliente do sistema.</p>
    </div>
  </div>

  <div class="report-controls">
    <div class="field"><label>Cliente</label><select id="repClient"></select></div>
    <div class="field"><label>Período</label><select id="repPeriod"><option value="Semanal">Semanal</option><option value="Mensal" selected>Mensal</option></select></div>
    <button class="btn btn-primary" id="generateBtn">Gerar relatório</button>
    <button class="btn btn-ghost" id="printBtn">Imprimir / Salvar PDF</button>
  </div>

  <div class="panel report-print-area" id="reportPanel"></div>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/dragdrop.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/pages/relatorios.js"></script>
</body>
</html>
