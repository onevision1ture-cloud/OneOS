<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipe — Onevision OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%236E1220'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-style='italic' font-size='58' fill='%23FAF6EF' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .member-card{background:var(--panel-bg);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:left;box-shadow:var(--shadow-sm);}
  .member-card .m-top{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px;}
  .member-card .m-name{font-family:'Space Grotesk',sans-serif;font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .member-card .m-cargo{font-size:12px;color:var(--wine);margin-top:2px;}
  .member-card .m-contact{font-size:12.5px;color:var(--ink-2);margin:2px 0;}
  .member-card .m-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .cargo-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);}
  .cargo-row:first-child{border-top:none;}
  .req-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap;}
  .req-row:first-child{border-top:none;}
</style>
</head>
<body>

<div id="page-content">
  <div class="page-head">
    <div>
      <h1>Nossa <em>equipe</em></h1>
      <p>Quem faz a Onevision acontecer — cargos, permissões e acesso de cada membro.</p>
    </div>
    <div class="page-head-actions">
      <button class="btn btn-primary" id="inviteBtn">+ Convidar membro</button>
    </div>
  </div>

  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="panel hidden" id="requestsPanel" style="margin-bottom:20px;">
    <div class="panel-head"><h3>Solicitações de acesso</h3></div>
    <div id="requestsList"></div>
  </div>

  <div class="panel" style="margin-bottom:20px;">
    <div class="panel-head"><h3>Cargos</h3><button class="btn btn-soft btn-sm" id="newCargoBtn">+ Novo cargo</button></div>
    <div id="cargosList"></div>
  </div>

  <div class="panel-head"><h3 style="font-size:20px;">Membros</h3></div>
  <div class="card-grid" id="teamGrid"></div>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/dragdrop.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/pages/equipe.js"></script>
</body>
</html>
