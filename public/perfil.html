<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu perfil — Onevision OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%236E1220'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-style='italic' font-size='58' fill='%23FAF6EF' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .profile-shell{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start;}
  .profile-photo-card{background:var(--panel-bg);border:1px solid var(--line);border-radius:20px;padding:28px;text-align:center;}
  .profile-photo-card .avatar-xl{margin:0 auto 16px;}
  .photo-upload-btn{margin-top:6px;}
  @media (max-width:820px){ .profile-shell{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div id="page-content">
  <div class="page-head">
    <div>
      <h1>Meu <em>perfil</em></h1>
      <p>Suas informações dentro do Onevision OS.</p>
    </div>
  </div>

  <div class="profile-shell">
    <div class="profile-photo-card">
      <div id="avatarPreview"></div>
      <b id="profName" style="font-family:'Space Grotesk',sans-serif;font-size:16px;display:block;margin-bottom:4px;"></b>
      <div class="text-faint text-sm" id="profCargo"></div>
      <div id="verifiedBadge" style="margin-top:14px;"></div>
      <input type="file" id="photoInput" accept="image/*" class="hidden">
      <button class="btn btn-soft btn-sm photo-upload-btn" id="uploadBtn">Alterar foto</button>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Dados pessoais</h3></div>
      <div class="field" style="margin-bottom:14px;"><label>Nome</label><input type="text" id="pfName"></div>
      <div class="field-row" style="margin-bottom:14px;">
        <div class="field"><label>E-mail</label><input type="email" id="pfEmail"></div>
        <div class="field"><label>Telefone</label><input type="text" id="pfPhone"></div>
      </div>
      <div class="field" style="margin-bottom:18px;"><label>Cargo</label><input type="text" id="pfCargo" disabled></div>
      <button class="btn btn-primary" id="saveProfileBtn">Salvar alterações</button>
    </div>
  </div>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/dragdrop.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/pages/perfil.js"></script>
</body>
</html>
