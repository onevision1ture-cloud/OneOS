<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos — Onevision OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%236E1220'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-style='italic' font-size='58' fill='%23FAF6EF' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .event-card{display:flex;align-items:center;gap:16px;background:var(--panel-bg);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:10px;cursor:grab;box-shadow:var(--shadow-sm);}
  .event-date-block{width:56px;height:56px;border-radius:14px;background:var(--cream-deep);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
  .event-date-block b{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px;line-height:1;}
  .event-date-block span{font-size:10px;color:var(--ink-3);text-transform:uppercase;}
  .event-info{flex:1;min-width:0;}
  .event-info b{font-family:'Space Grotesk',sans-serif;font-size:14.5px;}
  .event-info .e-meta{font-size:12px;color:var(--ink-2);margin-top:2px;}
  .event-actions{display:flex;gap:8px;flex-shrink:0;}
</style>
</head>
<body>

<div id="page-content">
  <div class="page-head">
    <div>
      <h1>Próximos <em>eventos</em></h1>
      <p>Arraste pra reorganizar a prioridade. Eventos próximos avisam automaticamente no sino do sistema.</p>
    </div>
    <div class="page-head-actions">
      <button class="btn btn-primary" id="newEventBtn">+ Novo evento</button>
    </div>
  </div>

  <div id="eventsList"></div>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/dragdrop.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/pages/eventos.js"></script>
</body>
</html>
