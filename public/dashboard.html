<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Onevision OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%236E1220'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-style='italic' font-size='58' fill='%23FAF6EF' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-bottom:20px;}
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-row .b-label{width:150px;flex-shrink:0;font-size:12.5px;font-family:'Space Grotesk',sans-serif;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-row .b-track{flex:1;}
  .bar-row .b-value{width:82px;flex-shrink:0;text-align:right;font-size:12px;color:var(--ink-2);font-family:'Space Grotesk',sans-serif;}
  .funnel-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
  .funnel-legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;font-family:'Space Grotesk',sans-serif;color:var(--ink-2);}
  .funnel-legend i{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
  .funnel-bar{display:flex;height:14px;border-radius:8px;overflow:hidden;}
  @media (max-width:980px){ .dash-grid{grid-template-columns:1fr;} }

  .kpi-card.hero{background:linear-gradient(155deg,var(--wine),#4A0C16);border-color:transparent;color:#FBF3E3;}
  .kpi-card.hero .kpi-label{color:rgba(251,243,227,.7);}
  .kpi-card.hero .kpi-value{color:#FBF3E3;}
  .kpi-card.hero .info-tip{color:rgba(251,243,227,.7);border-color:rgba(251,243,227,.4);}

  .goals-progress-wrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap;}
  .progress-ring-wrap{flex-shrink:0;position:relative;width:132px;height:132px;}
  .progress-ring-wrap svg{transform:rotate(-90deg);}
  .progress-ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .progress-ring-label b{font-family:'Space Grotesk',sans-serif;font-size:26px;}
  .progress-ring-label span{font-size:11px;color:var(--ink-3);text-align:center;max-width:90px;}
  .goals-list{flex:1;min-width:220px;}

  .team-row-list{display:flex;flex-direction:column;gap:14px;}
  .team-row{display:flex;align-items:center;gap:12px;}
  .team-row .tr-name{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;}
  .team-row .tr-sub{font-size:11.5px;color:var(--ink-3);}
</style>
</head>
<body>

<div id="page-content">
  <div class="page-head">
    <div>
      <h1>Visão <em>geral</em></h1>
      <p>Todos os números que importam — clientes, CRM, tarefas, campanhas e metas — num só painel.</p>
    </div>
  </div>

  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="dash-grid">
    <div class="panel">
      <div class="panel-head"><h3>Investimento por cliente</h3></div>
      <div id="investBars"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Funil de CRM</h3></div>
      <div class="funnel-bar" id="funnelBar"></div>
      <div class="funnel-legend" id="funnelLegend"></div>
    </div>
  </div>

  <div class="dash-grid">
    <div class="panel">
      <div class="panel-head"><h3>Tarefas por quadro (OneTasks)</h3></div>
      <div id="boardBars"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Equipe</h3></div>
      <div class="team-row-list" id="teamList"></div>
    </div>
  </div>

  <div class="dash-grid">
    <div class="panel">
      <div class="panel-head"><h3>Progresso das metas</h3></div>
      <div class="goals-progress-wrap">
        <div class="progress-ring-wrap" id="goalsRing"></div>
        <div class="goals-list" id="goalsProgress"></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Próximos eventos & reuniões</h3></div>
      <div id="dashAlerts"></div>
    </div>
  </div>
</div>
<script src="assets/js/store.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/dragdrop.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/pages/dashboard.js"></script>
</body>
</html>
