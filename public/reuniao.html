<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reunião — Onevision OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%236E1220'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-style='italic' font-size='58' fill='%23FAF6EF' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital,wght@0,400;1,400&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .cal-nav{display:flex;align-items:center;gap:10px;}
  .cal-nav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);}
  .cal-nav span{font-family:'Instrument Serif',serif;font-style:italic;font-size:19px;min-width:160px;text-align:center;}
  .cal-legend{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
  .cal-legend span{display:flex;align-items:center;gap:6px;font-size:12px;font-family:'Space Grotesk',sans-serif;color:var(--ink-2);}
  .cal-legend i{width:9px;height:9px;border-radius:3px;}
  .meeting-chip{background:var(--info-bg);color:var(--info);}
  .event-chip{background:var(--danger-bg);color:var(--danger);}
</style>
</head>
<body>

<div id="page-content">
  <div class="page-head">
    <div>
      <h1>Calendário de <em>reuniões</em></h1>
      <p>Reuniões e eventos da Onevision no mesmo calendário mensal — arraste as reuniões pra remarcar.</p>
    </div>
    <div class="page-head-actions">
      <button class="btn btn-primary" id="newMeetingBtn">+ Nova reunião</button>
    </div>
  </div>

  <div class="cal-legend">
    <span><i class="meeting-chip"></i> Reuniões (editável, arrastável)</span>
    <span><i class="event-chip"></i> Eventos (gerenciados em Eventos)</span>
  </div>

  <div class="page-head" style="margin-bottom:16px;">
    <div></div>
    <div class="cal-nav">
      <button id="prevBtn">‹</button>
      <span id="navLabel"></span>
      <button id="nextBtn">›</button>
    </div>
  </div>

  <div id="calendarWrap"></div>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/dragdrop.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/pages/reuniao.js"></script>
</body>
</html>
